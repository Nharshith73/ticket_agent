<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication — Support Ticket Triage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #15130f;
      --panel: #1c1912;
      --panel-2: #242018;
      --border: #2a241b;
      --border-focus: #4a4032;
      --accent: #4f7896;
      --accent-hover: #3b5f78;
      --text: #e6dfd5;
      --muted: #8c8273;
      --muted-2: #595246;
      --green-bg: #16291e;
      --green-border: #234832;
      --green-text: #6ec08a;
      --red-bg: #2d1818;
      --red-border: #4d2626;
      --red-text: #e07272;
      --font-main: 'IBM Plex Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 12px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--muted);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      margin-top: 8px;
      padding: 11px 16px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Status Messages */
    .status-msg {
      display: none;
      padding: 10px 12px;
      border-radius: 5px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .status-msg.err {
      display: block;
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      color: var(--red-text);
    }

    .status-msg.ok {
      display: block;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: var(--green-text);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">TR</div>
      <h1 class="brand-title">Support Ticket Triage</h1>
      <p class="brand-sub">Sign in to access your triage workspace</p>
    </div>

    <!-- Toggleable Tabs -->
    <div class="tabs-nav">
      <button type="button" class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">Login</button>
      <button type="button" class="tab-btn" id="tab-register-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="status-box" class="status-msg"></div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="login-username">Email / Username</label>
        <input type="text" id="login-username" required placeholder="name@company.com or username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" id="login-submit-btn" class="btn-submit">Sign In</button>
    </form>

    <!-- Create Account Form -->
    <form id="register-form" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="reg-username">Email / Username</label>
        <input type="text" id="reg-username" required placeholder="name@company.com or username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="4" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="reg-confirm-password">Confirm Password</label>
        <input type="password" id="reg-confirm-password" required minlength="4" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <button type="submit" id="register-submit-btn" class="btn-submit">Create Account</button>
    </form>
  </div>

  <script>
    const statusBox = document.getElementById('status-box');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabRegisterBtn = document.getElementById('tab-register-btn');

    function switchTab(tab) {
      statusBox.style.display = 'none';
      if (tab === 'login') {
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
      } else {
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
        registerForm.style.display = 'flex';
        loginForm.style.display = 'none';
      }
    }

    function showStatus(msg, isError = true) {
      statusBox.className = isError ? 'status-msg err' : 'status-msg ok';
      statusBox.textContent = msg;
    }

    // Login Form Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      statusBox.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-username').value.trim(),
            password: document.getElementById('login-password').value,
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Login failed.');
        }

        showStatus('✓ Login successful! Redirecting…', false);
        setTimeout(() => {
          window.location.href = data.redirect || '/admin';
        }, 400);
      } catch (err) {
        showStatus(err.message, true);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Create Account Form Submit
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        showStatus('Passwords do not match.', true);
        return;
      }

      const btn = document.getElementById('register-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      statusBox.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('reg-username').value.trim(),
            password: pass,
            confirm_password: confirmPass,
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Account creation failed.');
        }

        showStatus('✓ Account created! Redirecting to Admin Dashboard…', false);
        setTimeout(() => {
          window.location.href = data.redirect || '/admin';
        }, 500);
      } catch (err) {
        showStatus(err.message, true);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
